name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build PDF
        run: tectonic ddtn_research_program.tex
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddtn_research_program
          path: ddtn_research_program.pdf
          retention-days: 30

  run-mvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install dependencies
        run: pip install -r code/requirements.txt
      - name: Run MVM simulations
        run: python run_mvm.py
        working-directory: code
      - name: Run unit tests
        run: python -m pytest tests/ -v
        working-directory: code
